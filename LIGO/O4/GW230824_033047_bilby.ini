################################################################################
##  Job submission arguments
################################################################################

local = True
label = GW230824_033047
outdir = /home/tpausch/ET-Dingo/LIGO/O4/T4/outdir_bilby_GW230824_033047
overwrite-outdir = True
request-cpus = 24
request-memory = 8.0
request-memory-generation = 8.0
request-disk = 5
n-parallel = 1
accounting = None
transfer-files = True


################################################################################
##  Data generation arguments
################################################################################

trigger-time = GW230824_033047
detectors = [H1, L1]
# channel-dict = {H1:DCS-CALIB_STRAIN_C02, L1:DCS-CALIB_STRAIN_C02}
channel-dict = {H1:GWOSC, L1:GWOSC}
allow-tape = True
ignore-gwpy-data-quality-check = True
data-find-urltype = osdf

duration = 4.0
post-trigger-duration = 2.0
sampling-frequency = 4096
minimum-frequency = 20.0
maximum-frequency = 1024.0
resampling-method = lal

psd-length = 128
psd-maximum-duration = 1024
psd-method = median
psd-fractional-overlap = 0.0
tukey-roll-off = 0.4


################################################################################
##  Waveform / likelihood arguments
################################################################################

waveform-approximant = IMRPhenomXPHM
frequency-domain-source-model = lal_binary_black_hole
reference-frequency = 20.0
catch-waveform-errors = True
enforce-signal-duration = True

likelihood-type = GravitationalWaveTransient
time-reference = geocent
phase-marginalization = False
time-marginalization = False
distance-marginalization = False

calibration-model = None


################################################################################
##  Prior arguments
################################################################################

default-prior = BBHPriorDict
deltaT = 0.2
Toffset = 0.0

# Same as the dingo prior, with luminosity_distance already replaced by the
# comoving-volume version (bilby_pipe has no prior-dict-updates option).
prior-dict = {
  mass_1 = Constraint(minimum=10.0, maximum=200.0, name='mass_1'),
  mass_2 = Constraint(minimum=10.0, maximum=200.0, name='mass_2'),
  chirp_mass = bilby.gw.prior.UniformInComponentsChirpMass(minimum=15.0, maximum=150.0, name='chirp_mass'),
  mass_ratio = bilby.gw.prior.UniformInComponentsMassRatio(minimum=0.125, maximum=1.0, name='mass_ratio'),
  phase = Uniform(minimum=0.0, maximum=2 * np.pi, name='phase', boundary='periodic'),
  chi_1 = bilby.gw.prior.AlignedSpin(a_prior=Uniform(minimum=0, maximum=0.9), z_prior=Uniform(minimum=-1, maximum=1), name='chi_1', minimum=-0.9, maximum=0.9, num_interp=100000),
  chi_2 = bilby.gw.prior.AlignedSpin(a_prior=Uniform(minimum=0, maximum=0.9), z_prior=Uniform(minimum=-1, maximum=1), name='chi_2', minimum=-0.9, maximum=0.9, num_interp=100000),
  theta_jn = Sine(minimum=0.0, maximum=np.pi, name='theta_jn'),
  luminosity_distance = bilby.gw.prior.UniformComovingVolume(minimum=100, maximum=7000, name='luminosity_distance'),
  dec = Cosine(minimum=-np.pi/2, maximum=np.pi/2, name='dec'),
  ra = Uniform(minimum=0.0, maximum=2 * np.pi, name='ra', boundary='periodic'),
  psi = Uniform(minimum=0.0, maximum=np.pi, name='psi', boundary='periodic'),
}


################################################################################
##  Sampler arguments
################################################################################

sampler = dynesty
sampler-kwargs = {nlive: 1000, naccept: 60, sample: acceptance-walk, dlogz: 0.1, npool: 24}


################################################################################
##  Output / plotting arguments
################################################################################

result-format = hdf5
plot-corner = True
plot-marginal = True
plot-skymap = False
create-summary = False