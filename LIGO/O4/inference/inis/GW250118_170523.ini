################################################################################
##  Job submission arguments
################################################################################

local = True
#accounting = ligo.dev.o4.cbc.pe.dingo
request-cpus-importance-sampling = 12
n-parallel = 4
sampling-requirements = [TARGET.CUDAGlobalMemoryMb>40000]
# extra-lines = [+WantsGPUNode = True]
overwrite-outdir = True


################################################################################
##  Sampler arguments
################################################################################

model = /scratch/tpausch/models/LIGO_O4/model_latest.pt
device = 'cuda'
num-samples = 50000
batch-size = 50000
recover-log-prob = true
prior-dict-updates = {
luminosity_distance = bilby.gw.prior.UniformComovingVolume(minimum=100, maximum=7000, name='luminosity_distance'),
}

################################################################################
## Data generation arguments
################################################################################

trigger-time = GW250118_170523
label = GW250118_170523
outdir = outdir_GW250118_170523
# channel-dict = {H1:DCS-CALIB_STRAIN_C02, L1:DCS-CALIB_STRAIN_C02}
channel-dict = {H1:GWOSC, L1:GWOSC}
psd-length = 128
tukey-roll-off = 0.4
# sampling-frequency = 2048.0
importance-sampling-updates = {'duration': 1.0}

################################################################################
## Plotting arguments
################################################################################

plot-corner = true
plot-weights = true
plot-log-probs = true