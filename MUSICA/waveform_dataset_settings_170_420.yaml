domain:
  type: UniformFrequencyDomain
  f_min: 6.0
  f_max: 256.0 #IMBH don't go over 200
  delta_f: 0.125  # Expressions like 1.0/8.0 would require eval and are not supported

waveform_generator:
  approximant: IMRPhenomXPHM  #  IMRPhenomXPHM #SEOBNRv4PHM
  f_ref: 20.0
  #f_start: 6.0  # Optional setting useful for EOB waveforms. Overrides f_min when generating waveforms.
  spin_conversion_phase: 0.0
  
# Dataset only samples over intrinsic parameters. Extrinsic parameters are chosen at train time.
intrinsic_prior:
  mass_1: bilby.core.prior.Constraint(minimum=50.0, maximum=1700.0, name='mass_1')
  mass_2: bilby.core.prior.Constraint(minimum=50.0, maximum=1700.0, name='mass_2')
  chirp_mass: bilby.gw.prior.UniformInComponentsChirpMass(minimum=170.0, maximum=420.0, name='chirp_mass') #over 700 signals get shorter than 100ms 
  mass_ratio: bilby.gw.prior.UniformInComponentsMassRatio(minimum=0.125, maximum=1.0, name='mass_ratio')
  phase: default
  chi_1: bilby.gw.prior.AlignedSpin(name='chi_1', a_prior=Uniform(minimum=0, maximum=0.9))
  chi_2: bilby.gw.prior.AlignedSpin(name='chi_2', a_prior=Uniform(minimum=0, maximum=0.9))
  theta_jn: default
  # Reference values for fixed (extrinsic) parameters. These are needed to generate a waveform.
  luminosity_distance: 1000.0  # Mpc  #should be choosen at the lower end of prior. BBH Mockdata has 99.99% above 500 Mpc
  geocent_time: 0.0  # s

# Dataset size
num_samples: 5000000

# Save a compressed representation of the dataset
compression:
  svd:
    # Truncate the SVD basis at this size. No truncation if zero.
    size: 400 
    num_training_samples: 50000
    num_validation_samples: 10000
  whitening: ET_ASD_10km.txt