data:
  waveform_dataset_path: /scratch/tpausch/waveforms/waveform_dataset_T8_imbh1.hdf5  # Contains intrinsic waveforms
  train_fraction: 0.95
  domain_update:
    f_min: 6.0
    f_max: 256.0
  svd_size_update: 400  # Optionally, reduce the SVD size when decompressing (for performance)
  detectors:
    - ET-1
    - ET-2
    - ET-3
  extrinsic_prior:  # Sampled at train time
    dec: default
    ra: default
    geocent_time: bilby.core.prior.Uniform(minimum=-0.10, maximum=0.10, name='geocent_time')
    psi: default
    luminosity_distance: bilby.core.prior.LogUniform(minimum=1000.0, maximum=100_000.0, name='luminosity_distance')
  ref_time: 1126259462.391
  inference_parameters:
  - chirp_mass
  #- mass_ratio
  #- chi_1
  #- chi_2
  #- theta_jn
  #- dec
  #- ra
  #- geocent_time
  #- luminosity_distance
  #- psi
